<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fin·MX">
<title>Fin·MX</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{--bg:#0a0c12;--bg2:#111520;--bg3:#1a2035;--ln:#222a3e;--lime:#c5f135;--red:#ff3b5c;--amber:#ffb830;--sky:#38d9f5;--fog:#5e6d8a;--txt:#c8d0e0;--wht:#e4e9f5;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,sans-serif;}
#wrap{display:flex;flex-direction:column;height:100vh;height:-webkit-fill-available;}
#top{background:var(--bg2);border-bottom:1px solid var(--ln);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;}
.ttl{font-size:17px;font-weight:800;color:var(--wht);}
.ttl span{color:var(--lime);}
.sub{font-size:10px;color:var(--fog);}
.pill{background:var(--bg3);border:1px solid var(--ln);color:var(--sky);font-size:11px;font-weight:700;padding:5px 12px;border-radius:20px;}
#mid{flex:1;overflow-y:scroll;-webkit-overflow-scrolling:touch;padding:14px 14px 20px;}
.page{display:none;}
.page.on{display:block;}
#nav{display:flex;background:var(--bg2);border-top:1px solid var(--ln);flex-shrink:0;}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px 4px;background:none;border:none;color:var(--fog);font-size:9px;font-weight:600;cursor:pointer;font-family:inherit;}
.nb.on{color:var(--lime);}
.ni{font-size:17px;line-height:1;}
.ph h1{font-size:21px;font-weight:800;color:var(--wht);letter-spacing:-0.5px;margin-bottom:4px;}
.ph h1 span{color:var(--lime);}
.ph p{font-size:11px;color:var(--fog);margin-bottom:16px;}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--ln);border-radius:6px;overflow:hidden;margin-bottom:14px;}
.sk{background:var(--bg2);padding:13px 11px;position:relative;}
.sk::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.skL::after{background:var(--lime)}.skR::after{background:var(--red)}.skS::after{background:var(--sky)}.skA::after{background:var(--amber)}
.skl{font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--fog);margin-bottom:5px;}
.skv{font-size:18px;font-weight:800;}
.skvL{color:var(--lime)}.skvR{color:var(--red)}.skvS{color:var(--sky)}.skvA{color:var(--amber)}
.skh{font-size:9px;color:var(--fog);margin-top:2px;}
.card{background:var(--bg2);border:1px solid var(--ln);border-radius:8px;padding:14px;margin-bottom:12px;}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.ct{font-size:11px;font-weight:800;color:var(--wht);text-transform:uppercase;letter-spacing:0.4px;}
.cs{font-size:10px;color:var(--fog);}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(34,42,62,0.6);}
.row:last-child{border-bottom:none;}
.rb{flex:1;min-width:0;}
.rn{font-size:13px;color:var(--wht);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.rs{font-size:10px;color:var(--fog);margin-top:2px;}
.rr{text-align:right;flex-shrink:0;}
.ra{font-size:14px;font-weight:700;}
.rh{font-size:10px;color:var(--fog);margin-top:1px;}
.bdg{font-size:8px;font-weight:800;padding:2px 6px;letter-spacing:0.5px;text-transform:uppercase;border-radius:3px;}
.bm{background:rgba(255,184,48,.12);color:var(--amber)}.bs{background:rgba(255,59,92,.12);color:var(--red)}.bf{background:rgba(56,217,245,.12);color:var(--sky)}.bb{background:rgba(94,109,138,.15);color:var(--fog)}
.btn{font-size:13px;font-weight:700;padding:12px 18px;border:none;cursor:pointer;border-radius:8px;min-height:44px;width:100%;font-family:inherit;-webkit-appearance:none;}
.btnL{background:var(--lime);color:#000;}
.btnG{background:var(--bg3);border:1px solid var(--ln);color:var(--txt);}
.btns{padding:8px 14px;font-size:12px;min-height:36px;width:auto;}
.ff{margin-bottom:14px;}
.ff label{display:block;font-size:10px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;color:var(--fog);margin-bottom:6px;}
.ff input,.ff select{width:100%;background:var(--bg3);border:1px solid var(--ln);border-radius:8px;color:var(--wht);padding:12px 14px;font-size:15px;font-family:inherit;outline:none;min-height:44px;-webkit-appearance:none;appearance:none;}
.ff input:focus,.ff select:focus{border-color:var(--lime);}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.ih{background:rgba(197,241,53,.08);border:1px solid rgba(197,241,53,.2);border-radius:10px;padding:14px;margin-bottom:14px;}
.ih label{font-size:9px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;color:var(--lime);margin-bottom:6px;display:block;}
.ih input{width:100%;background:transparent;border:none;color:var(--lime);font-size:28px;font-weight:800;outline:none;font-family:inherit;}
.dl{font-size:9px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--fog);margin:14px 0 8px;display:flex;align-items:center;gap:8px;}
.dl::after{content:'';flex:1;height:1px;background:var(--ln);}
.empty{text-align:center;padding:24px;color:var(--fog);font-size:12px;}
.tdc{background:var(--bg2);border:1px solid var(--ln);border-radius:10px;margin-bottom:12px;overflow:hidden;}
.tdch{padding:13px 13px 9px;}
.tdcb{font-size:10px;font-weight:800;letter-spacing:1px;text-transform:uppercase;}
.tdcn{font-size:9px;color:var(--fog);margin-top:2px;}
.tdcbd{padding:10px 13px;}
.tdcr{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(34,42,62,.4);}
.tdcr:last-child{border-bottom:none;}
.tdcrl{font-size:10px;color:var(--fog);}
.tdcrv{font-size:12px;font-weight:700;}
.al{margin:8px 13px 13px;padding:10px 12px;border-radius:8px;font-size:11px;line-height:1.6;}
.aok{background:rgba(197,241,53,.08);border:1px solid rgba(197,241,53,.2);color:var(--lime);}
.aw{background:rgba(255,184,48,.1);border:1px solid rgba(255,184,48,.25);color:var(--amber);}
.au{background:rgba(255,59,92,.1);border:1px solid rgba(255,59,92,.3);color:var(--red);}
.tl{position:relative;padding-left:18px;}
.tl::before{content:'';position:absolute;left:3px;top:0;bottom:0;width:1px;background:var(--ln);}
.tli{position:relative;margin-bottom:16px;}
.tld{position:absolute;left:-18px;top:4px;width:7px;height:7px;border-radius:50%;border:2px solid var(--bg2);}
.tlw{font-size:9px;color:var(--fog);font-weight:700;text-transform:uppercase;letter-spacing:0.8px;}
.tlt{font-size:13px;font-weight:700;color:var(--wht);margin:2px 0;}
.tls{font-size:11px;color:var(--fog);line-height:1.5;}
.tla{font-size:12px;font-weight:700;margin-top:3px;}
.pbg{height:10px;background:var(--bg3);border-radius:5px;overflow:hidden;}
.pfill{height:100%;border-radius:5px;transition:width .5s;}
.prow{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid rgba(34,42,62,.6);}
.prow:last-child{border-bottom:none;}
.pm{min-width:68px;}
.pmn{font-size:13px;font-weight:700;color:var(--wht);}
.pme{font-size:9px;color:var(--lime);margin-top:2px;line-height:1.4;}
.pcur .pmn{color:var(--sky)}.ppast .pmn{color:var(--fog)}
.pns{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:3px 10px;}
.pn{display:flex;flex-direction:column;}
.pnl{font-size:9px;color:var(--fog);font-weight:600;}
.pnv{font-size:12px;font-weight:700;}
.pfv{font-size:15px;font-weight:800;}
.cL{color:var(--lime)}.cR{color:var(--red)}.cS{color:var(--sky)}.cA{color:var(--amber)}.cF{color:var(--fog)}
.prev{display:none;margin-bottom:14px;padding:11px;background:var(--bg3);border:1px solid var(--ln);border-radius:8px;font-size:11px;line-height:1.8;color:var(--fog);}
.cf{font-size:10px;padding:6px 12px;min-height:34px;width:auto;}
.cf.on{background:rgba(197,241,53,.09)!important;border-color:rgba(197,241,53,.3)!important;color:var(--lime)!important;}
.bc{display:flex;align-items:flex-end;gap:3px;}
.bcc{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;}
.bcb{width:100%;border-radius:2px 2px 0 0;}
.bcl{font-size:9px;color:var(--fog);}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--bg3);border:1px solid var(--lime);border-radius:20px;padding:9px 18px;font-size:12px;font-weight:700;color:var(--lime);z-index:999;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:500;display:none;align-items:center;justify-content:center;}
.modal.on{display:flex;}
.mbox{background:var(--bg2);border:1px solid var(--ln);border-radius:14px;padding:20px;width:88%;max-width:360px;max-height:70vh;overflow-y:auto;}
.mbox h3{font-size:16px;font-weight:800;color:var(--wht);margin-bottom:14px;}
.mopt{padding:12px 14px;border-radius:8px;margin-bottom:6px;font-size:14px;color:var(--txt);cursor:pointer;}
.mopt.on{background:rgba(197,241,53,.09);color:var(--lime);font-weight:700;}
#savebtn{position:fixed;bottom:82px;right:14px;background:var(--lime);color:#000;font-size:11px;font-weight:800;padding:9px 16px;border-radius:20px;border:none;cursor:pointer;z-index:100;font-family:inherit;}
</style>
</head>
<body>
<div id="wrap">
<div id="top">
  <div><div class="ttl">Fin<span>·</span>MX</div><div class="sub">Juan Pablo Leyva G.</div></div>
  <button class="pill" id="mpill" onclick="document.getElementById('mmodal').classList.add('on')">Marzo 2026</button>
</div>
<div id="mid">
  <div id="p0" class="page on"></div>
  <div id="p1" class="page"></div>
  <div id="p2" class="page"></div>
  <div id="p3" class="page"></div>
  <div id="p4" class="page"></div>
  <div id="p5" class="page"></div>
</div>
<div id="nav">
  <button class="nb on" onclick="go(0,this)"><span class="ni">▦</span>Panel</button>
  <button class="nb" onclick="go(1,this)"><span class="ni">≡</span>Gastos</button>
  <button class="nb" onclick="go(2,this)"><span class="ni">💳</span>TDC</button>
  <button class="nb" onclick="go(3,this)"><span class="ni">🛒</span>Compras</button>
  <button class="nb" onclick="go(4,this)"><span class="ni">↗</span>Proy.</button>
  <button class="nb" onclick="go(5,this)"><span class="ni">◎</span>Fondo</button>
</div>
</div>

<div class="modal" id="mmodal">
  <div class="mbox">
    <h3>Seleccionar mes</h3>
    <div id="mopts"></div>
    <button class="btn btnG" style="margin-top:10px" onclick="document.getElementById('mmodal').classList.remove('on')">Cancelar</button>
  </div>
</div>

<div id="toast"></div>
<button id="savebtn" onclick="guardar()">🔗 Guardar</button>

<script>
var MN=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
var MF=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
var BY=2026,BM=1,ING0=27419,META=87000;
var TDCS={
  invex:{id:'invex',bank:'INVEX Volaris',num:'XXXX 2592',color:'#a78bfa',corte:26,lim:20,tasa:15,sr:75854,sm:28332},
  banregio:{id:'banregio',bank:'BanRegio TC MÁS',num:'XXXX 3337',color:'#fb923c',corte:25,lim:20,tasa:22.79,sr:8189,sm:12306},
  bbva:{id:'bbva',bank:'BBVA Platinum',num:'XXXX 6473',color:'#38bdf8',corte:7,lim:20,tasa:39.69,sr:20269,sm:12262}
};
var SEED=[
  {id:'f01',nom:'Hipoteca',cat:'fijo',mnt:10000,rest:220,p:1},
  {id:'f10',nom:'Telcel (2 líneas)',cat:'sub',mnt:997,rest:999,p:1},
  {id:'f11',nom:'YouTube Premium',cat:'sub',mnt:319,rest:999,p:1},
  {id:'f02',nom:'INVEX Seg. Atlas 2026',cat:'seg',mnt:5488,rest:12},
  {id:'f03',nom:'INVEX Volaris Moto Deb 2',cat:'msi',mnt:4054,rest:2},
  {id:'f04',nom:'INVEX MercadoPago Velocita',cat:'msi',mnt:617,rest:10},
  {id:'f05',nom:'INVEX Amazon Mex nov',cat:'msi',mnt:625,rest:9},
  {id:'f06',nom:'INVEX Prog Cero 12 MSI',cat:'msi',mnt:561,rest:6},
  {id:'f08',nom:'INVEX Sfera Explanada',cat:'msi',mnt:588,rest:4},
  {id:'f09',nom:'INVEX Amazon oct',cat:'msi',mnt:336,rest:8},
  {id:'f0a',nom:'INVEX Amazon nov $1,954',cat:'msi',mnt:326,rest:4},
  {id:'f0b',nom:'INVEX Amazon dic $860',cat:'msi',mnt:143,rest:4},
  {id:'f0e',nom:'INVEX KOF adicional',cat:'fijo',mnt:232,rest:999,p:1},
  {id:'b01',nom:'BanRegio G Óptima MSI',cat:'msi',mnt:1119,rest:12},
  {id:'b02',nom:'BanRegio Total Play',cat:'sub',mnt:660,rest:999,p:1},
  {id:'b03',nom:'BanRegio Fisiomove',cat:'fijo',mnt:4500,rest:999,p:1},
  {id:'v01',nom:'BBVA iShop Mixup MSI',cat:'msi',mnt:1115,rest:11},
  {id:'v02',nom:'BBVA Netflix',cat:'sub',mnt:249,rest:999,p:1},
  {id:'v03',nom:'BBVA Apple.com',cat:'sub',mnt:249,rest:999,p:1},
  {id:'v04',nom:'BBVA CFE luz',cat:'fijo',mnt:2022,rest:999,p:1}
];
function defS(){return{fijos:JSON.parse(JSON.stringify(SEED)),meses:{'2026-3':{ingreso:27419,extras:[]}},fondo:{total:0,deps:[]},tdcs:JSON.parse(JSON.stringify(TDCS)),pagos:[],compras:[],idx:2};}
var S=defS();
try{var ls=localStorage.getItem('finmx5');if(ls){var p=JSON.parse(ls);if(p&&p.fijos)S=p;}}catch(e){}
if(!S.tdcs)S.tdcs=JSON.parse(JSON.stringify(TDCS));
if(!S.pagos)S.pagos=[];
if(!S.compras)S.compras=[];
var IDX=S.idx||2,cFil='',curPage=0;

function fmt(n){return'$'+Math.round(n).toLocaleString('es-MX');}
function now(){return new Date();}
function md(i){var m=BM+i,y=BY+Math.floor(m/12);m=((m%12)+12)%12;return{y:y,m:m};}
function mk(i){var d=md(i);return d.y+'-'+d.m;}
function ml(i){var d=md(i);return MF[d.m]+' '+d.y;}
function ms(i){var d=md(i);return MN[d.m];}
function gmd(i){var k=mk(i);if(!S.meses[k])S.meses[k]={ingreso:ING0,extras:[]};return S.meses[k];}
function ing(i){return gmd(i).ingreso||ING0;}
function exts(i){return gmd(i).extras||[];}
function sumE(i){return exts(i).reduce(function(a,e){return a+e.mnt;},0);}
function fijosEn(i){return S.fijos.filter(function(f){return f.p||(f.rest-i)>0;});}
function sumF(i){return fijosEn(i).reduce(function(a,f){return a+f.mnt;},0);}
function sumG(i){return sumF(i)+sumE(i);}
function flu(i){return ing(i)-sumG(i);}
function sv(){S.idx=IDX;try{localStorage.setItem('finmx5',JSON.stringify(S));}catch(e){}}

function go(n,btn){
  document.querySelectorAll('.page').forEach(function(p){p.classList.remove('on');});
  document.querySelectorAll('.nb').forEach(function(b){b.classList.remove('on');});
  document.getElementById('p'+n).classList.add('on');
  btn.classList.add('on');
  document.getElementById('mid').scrollTop=0;
  curPage=n;
  render();
}

function guardar(){
  try{
    var j=JSON.stringify(S);
    var b=btoa(unescape(encodeURIComponent(j)));
    var url=location.href.split('#')[0]+'#'+b;
    if(navigator.clipboard){
      navigator.clipboard.writeText(url).then(function(){toast('🔗 Enlace copiado');}).catch(function(){location.hash=b;toast('URL guardada');});
    }else{location.hash=b;toast('URL guardada');}
  }catch(e){toast('Error al guardar');}
}

function tdcE(id){
  var t=S.tdcs[id],n=now();
  var d=md(IDX),corte=new Date(d.y,d.m,t.corte);
  if(n>corte)corte=new Date(d.y,d.m+1,t.corte);
  var lim=new Date(corte);lim.setDate(lim.getDate()+t.lim);
  var dias=Math.ceil((lim-n)/864e5);
  var pag=S.pagos.filter(function(p){return p.tdc===id;}).reduce(function(a,p){return a+p.mnt;},0);
  var pend=Math.max(0,(t.sr||0)-pag);
  var st='ok',msg='';
  if(pend>0){
    if(dias<=3){st='u';msg='⚠️ '+dias+' día'+(dias!==1?'s':'')+' para el límite';}
    else if(dias<=7){st='w';msg='📅 Límite en '+dias+' días';}
    else{st='w';msg='Límite: '+lim.getDate()+' '+MN[lim.getMonth()];}
  }else{msg='✓ Pagado este periodo';}
  return{t:t,pend:pend,pag:pag,lim:lim,dias:dias,st:st,msg:msg};
}

function render(){
  document.getElementById('mpill').textContent=ml(IDX);
  if(curPage===0)rDash();
  else if(curPage===1)rGas();
  else if(curPage===2)rTDC();
  else if(curPage===3)rComp();
  else if(curPage===4)rProj();
  else if(curPage===5)rFondo();
}

function rAll(){for(var i=0;i<6;i++){if(document.getElementById('p'+i).classList.contains('on'))render();}}

function rDash(){
  var i=IDX,ig=ing(i),ga=sumG(i),fl=ig-ga;
  var msi=fijosEn(i).filter(function(f){return f.cat==='msi'||f.cat==='seg';}).reduce(function(a,f){return a+f.mnt;},0);
  var todos=fijosEn(i).map(function(f){return{n:f.nom,v:f.mnt,c:f.cat};}).concat(exts(i).map(function(e){return{n:e.nom,v:e.mnt,c:'extra'};})).sort(function(a,b){return b.v-a.v;});
  var COL={fijo:'var(--sky)',msi:'var(--amber)',seg:'var(--red)',sub:'var(--fog)',extra:'var(--lime)'};
  var m6=[];for(var k=i-5;k<=i;k++)m6.push(k);
  var maxH=1;m6.forEach(function(k){if(k>=0){var v=Math.max(ing(k),sumG(k));if(v>maxH)maxH=v;}});
  var term=S.fijos.filter(function(f){return !f.p&&(f.rest-i)>=1&&(f.rest-i)<=3;}).sort(function(a,b){return(a.rest-i)-(b.rest-i);});
  var h='<div class="ph"><h1>Panel<span>.</span></h1><p>Resumen · '+ml(i)+'</p></div>';
  h+='<div class="sg">';
  h+='<div class="sk skL"><div class="skl">Ingreso</div><div class="skv skvL">'+fmt(ig)+'</div><div class="skh">Nómina</div></div>';
  h+='<div class="sk skR"><div class="skl">Gasto total</div><div class="skv skvR">'+fmt(ga)+'</div><div class="skh">Fijos+MSI</div></div>';
  h+='<div class="sk skS"><div class="skl">Flujo libre</div><div class="skv '+(fl>=0?'skvS':'skvR')+'">'+fmt(fl)+'</div><div class="skh">'+(fl>=0?'Disponible':'Déficit')+'</div></div>';
  h+='<div class="sk skA"><div class="skl">MSI total</div><div class="skv skvA">'+fmt(msi)+'</div><div class="skh">Cuotas mes</div></div>';
  h+='</div>';
  h+='<div class="card"><div class="ch"><span class="ct">Distribución</span></div>';
  if(todos.length){todos.slice(0,8).forEach(function(g){h+='<div style="display:flex;align-items:center;gap:8px;margin-bottom:9px"><div style="font-size:11px;color:var(--fog);width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex-shrink:0">'+g.n+'</div><div style="flex:1;height:4px;background:var(--bg3);border-radius:2px;overflow:hidden"><div style="height:100%;width:'+Math.round(g.v/(todos[0].v||1)*100)+'%;background:'+(COL[g.c]||'#888')+'"></div></div><div style="font-size:11px;color:'+(COL[g.c]||'#888')+';width:62px;text-align:right;flex-shrink:0">'+fmt(g.v)+'</div></div>';});}
  else h+='<div class="empty">Sin datos</div>';
  h+='</div>';

function addEx(){var nom=prompt('Concepto:');if(!nom)return;var mnt=parseFloat(prompt('Monto ($):')||0);if(!mnt||mnt<=0){toast('Monto inválido');return;}gmd(IDX).extras.push({nom:nom,mnt:mnt,cat:'extra',meses:1});sv();rGas();toast('Gasto agregado ✓');}
function delEx(k){gmd(IDX).extras.splice(k,1);sv();rGas();toast('Eliminado');}
function editF(id){var f=S.fijos.find(function(x){return x.id===id;});if(!f)return;var nom=prompt('Nombre:',f.nom)||f.nom;var mnt=parseFloat(prompt('Monto/mes ($):',f.mnt)||f.mnt);if(!mnt||mnt<=0){toast('Inválido');return;}f.nom=nom;f.mnt=mnt;if(!f.p){var r=parseInt(prompt('Meses restantes:',Math.max(1,f.rest-IDX))||1);f.rest=IDX+r;}sv();rGas();toast('Actualizado ✓');}
function editS(id){var t=S.tdcs[id];var v=prompt('Nuevo saldo para '+t.bank+':\n(Actual: '+fmt(t.sr)+')',t.sr);if(v===null)return;var n=parseFloat(v);if(isNaN(n)){toast('Inválido');return;}S.tdcs[id].sr=n;sv();rTDC();toast('Saldo actualizado ✓');}
function pagRap(id,mnt){var h=now();S.pagos.push({tdc:id,mnt:mnt,fecha:h.getDate()+' '+MN[h.getMonth()]+' '+h.getFullYear(),nota:'Pago total'});sv();rTDC();toast(fmt(mnt)+' registrado ✓');}
function regP(){var id=document.getElementById('pt').value;var mnt=parseFloat(document.getElementById('pm').value)||0;if(mnt<=0){toast('Ingresa un monto ⚠');return;}var fr=document.getElementById('pf').value;var nota=document.getElementById('pn').value.trim();var fecha=fr;if(fr){var p=fr.split('-');fecha=parseInt(p[2])+' '+MN[parseInt(p[1])-1]+' '+p[0];}S.pagos.push({tdc:id,mnt:mnt,fecha:fecha,nota:nota});sv();rTDC();toast('Pago registrado ✓');}
function delP(k){S.pagos.splice(k,1);sv();rTDC();toast('Eliminado');}
function togM(){var msi=document.getElementById('ctipo').value==='msi';var w=document.getElementById('cmw');if(w)w.style.display=msi?'block':'none';updP();}
function updP(){var nom=(document.getElementById('cnom')||{}).value||'';var mnt=parseFloat((document.getElementById('cmnt')||{}).value||0)||0;var tdcId=(document.getElementById('ctdc')||{}).value||'invex';var tipo=(document.getElementById('ctipo')||{}).value||'normal';var meses=parseInt((document.getElementById('cmeses')||{}).value||12)||12;var prev=document.getElementById('cprev');if(!prev)return;if(!mnt){prev.style.display='none';return;}var t=S.tdcs[tdcId];var e=tdcE(tdcId);var h='<span style="color:var(--wht);font-weight:700">'+(nom||'Compra')+'</span> · '+fmt(mnt)+'<br>Tarjeta: <span style="color:'+t.color+'">'+t.bank+'</span><br>';if(tipo==='msi'){h+='MSI: <span style="color:var(--amber)">'+fmt(Math.round(mnt/meses))+'/mes × '+meses+' meses</span>';}else{h+='Nuevo saldo: <span style="color:'+((e.pend+mnt)>20000?'var(--red)':'var(--amber)')+'">'+fmt(e.pend+mnt)+'</span> · Límite: <span style="color:var(--red)">'+e.lim.getDate()+' '+MN[e.lim.getMonth()]+' '+e.lim.getFullYear()+'</span>';}prev.style.display='block';prev.innerHTML=h;}
function addC(){var nom=(document.getElementById('cnom')||{}).value||'';var mnt=parseFloat((document.getElementById('cmnt')||{}).value||0)||0;var tdcId=(document.getElementById('ctdc')||{}).value||'invex';var tipo=(document.getElementById('ctipo')||{}).value||'normal';var meses=parseInt((document.getElementById('cmeses')||{}).value||12)||12;var cat=(document.getElementById('ccat')||{}).value||'otro';var fr=(document.getElementById('cfecha')||{}).value||'';if(!nom.trim()){toast('Escribe el concepto ⚠');return;}if(mnt<=0){toast('Ingresa el monto ⚠');return;}var fecha=fr;if(fr){var p=fr.split('-');fecha=parseInt(p[2])+' '+MN[parseInt(p[1])-1]+' '+p[0];}var cuota=tipo==='msi'?Math.round(mnt/meses):mnt;S.compras.push({id:'c'+Date.now(),nom:nom.trim(),mnt:mnt,tdcId:tdcId,tipo:tipo,cat:cat,fecha:fecha,meses:tipo==='msi'?meses:1,cuota:cuota});if(tipo==='normal')S.tdcs[tdcId].sr=(S.tdcs[tdcId].sr||0)+mnt;if(tipo==='msi')S.fijos.push({id:'cm'+Date.now(),nom:tdcId.toUpperCase()+' · '+nom.trim(),cat:'msi',mnt:cuota,rest:IDX+meses});sv();rComp();toast('Compra registrada ✓');}
function setF(f,btn){cFil=f;rComp();}
function delC(k){var c=S.compras[k];if(!c)return;if(c.tipo==='normal')S.tdcs[c.tdcId].sr=Math.max(0,(S.tdcs[c.tdcId].sr||0)-c.mnt);S.compras.splice(k,1);sv();rComp();toast('Eliminada');}
function dep(){var mnt=parseFloat(document.getElementById('dm').value)||0;var nota=document.getElementById('dn').value.trim()||'Depósito';if(mnt<=0){toast('Ingresa un monto ⚠');return;}var h=now();S.fondo.deps.push({mnt:mnt,nota:nota,fecha:h.getDate()+' '+MN[h.getMonth()]+' '+h.getFullYear()});S.fondo.total=(S.fondo.total||0)+mnt;sv();rFondo();toast(fmt(mnt)+' depositado ✓');}
function delD(k){var d=S.fondo.deps[k];if(!d)return;S.fondo.total=Math.max(0,(S.fondo.total||0)-d.mnt);S.fondo.deps.splice(k,1);sv();rFondo();}

var toastT;
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(function(){t.classList.remove('on');},2500);}

var mo=document.getElementById('mopts');
for(var i=0;i<20;i++){
  (function(n){
    var d=document.createElement('div');
    d.className='mopt'+(n===IDX?' on':'');
    d.textContent=ml(n);
    d.onclick=function(){
      IDX=n;S.idx=n;sv();
      document.getElementById('mmodal').classList.remove('on');
      document.querySelectorAll('.mopt').forEach(function(el,j){el.classList.toggle('on',j===n);});
      render();
    };
    mo.appendChild(d);
  })(i);
}

rDash();
</script>
